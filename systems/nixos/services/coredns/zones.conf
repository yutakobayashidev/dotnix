# More-specific zones bypass public filtering and stale-answer caching.
@tailDomain@:53 {
    import common
    forward . 100.100.100.100
}

@homeDomain@:53 {
    import common
    template ANY A {
        answer "{{ .Name }} 300 IN A @tailnetAddress@"
    }
    template ANY AAAA {
        rcode NOERROR
    }
    import upstream
}

# Preserve the existing host-local override.
www.mod.gov.cn:53 {
    import common
    hosts {
        www.mod.gov.cn @hostName@
    }
}
