# More-specific zones bypass public filtering and stale-answer caching.
@tailDomain@:53 {
    import common
    forward . 100.100.100.100
}

# Resolve app addresses through MagicDNS, then restore the requested name.
# Restrict rewriting to addresses so ACME TXT lookups still reach public DNS.
@homeDomain@:53 {
    view home_addresses {
        expr type() in ['A', 'AAAA']
    }
    import common
    rewrite stop name regex .* @appHost@. answer auto
    forward . 100.100.100.100
}

@homeDomain@:53 {
    import common
    # These names exist, but have no HTTPS/SVCB service-binding records.
    # Forwarding these types to public DNS would cache NXDOMAIN for the name.
    template IN HTTPS {
        rcode NOERROR
    }
    template IN SVCB {
        rcode NOERROR
    }
    import upstream
}

# Preserve the existing host-local override.
www.mod.gov.cn:53 {
    import common
    hosts {
        www.mod.gov.cn @hostName@
    }
}
