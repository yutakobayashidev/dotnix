# Match nyanshiba's cache policy: reply immediately with stale data, then refresh.
# Expired answers remain eligible for 24h; this does not cover CoreDNS host failure.
# https://github.com/nyanshiba/corednsconf/blob/main/coredns/Corefile%40root
# https://coredns.io/plugins/cache/
cache {
    serve_stale 24h immediate
}
