[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "session-tts-codex"
version = "0.1.0"
description = "Codex TTS runtime: HTTP client"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.scripts]
session-tts-say-response = "session_tts.core:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
