# Thanks: https://github.com/ryoppippi/dotfiles/blob/main/.github/actions/setup-git-bot/action.yaml
name: Setup Git Bot
description: Get a yuta-octo-sts token from the self-hosted Octo STS and configure git identity

inputs:
  identity:
    description: Trust policy in .github/chainguard/<identity>.sts.yaml that grants the token
    required: true

outputs:
  token:
    description: Short-lived GitHub App installation token, revoked when the job ends
    value: ${{ steps.token.outputs.token }}

runs:
  using: composite
  steps:
    # Octo STS exchanges this job's OIDC token for a token with only the
    # permissions the trust policy grants. The caller needs id-token: write.
    # See docs/octo-sts.md.
    - id: token
      uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
      with:
        domain: sts.yutakobayashi.com
        scope: ${{ github.repository }}
        identity: ${{ inputs.identity }}

    - shell: bash
      env:
        GH_TOKEN: ${{ steps.token.outputs.token }}
        APP_SLUG: yuta-octo-sts
      run: |
        BOT_ID=$(gh api "users/${APP_SLUG}[bot]" --jq '.id')
        git config user.name "${APP_SLUG}[bot]"
        git config user.email "${BOT_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
