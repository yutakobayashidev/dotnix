# Thanks: https://github.com/ryoppippi/dotfiles/blob/main/.github/workflows/update-flake-frequent.yaml
name: 'Update Flake Inputs (Frequent)'

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  update:
    uses: $/.github/workflows/_update-flake-reusable.yaml
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    with:
      inputs: 'llm-agents'
      skip-delay: true
      minimum-release-age-days: '0'
