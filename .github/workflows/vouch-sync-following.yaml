name: 'Vouch: Sync Following'

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Generate VOUCHED.td from following
        id: compare
        run: |
          gh api users/yutakobayashidev/following --paginate --jq '.[].login' | sort > /tmp/following.txt

          {
            echo "# Users vouched for this project."
            echo "# Only vouched users may open pull requests."
            echo "# Sourced from yutakobayashidev's GitHub following."
            echo "# Auto-updated by Vouch: Sync Following workflow."
            echo "# Add or remove entries as trust relationships evolve."
            sed 's/^/github:/' /tmp/following.txt
          } > /tmp/VOUCHED.td.new

          if ! diff -q .github/VOUCHED.td /tmp/VOUCHED.td.new > /dev/null 2>&1; then
            cp /tmp/VOUCHED.td.new .github/VOUCHED.td
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Create pull request
        if: steps.compare.outputs.changed == 'true'
        run: |
          BRANCH="vouch/sync-following-$(date +%s)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add .github/VOUCHED.td
          git commit -m "vouch: sync following list"
          git push origin "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "vouch: sync following list" \
            --body "Automatically generated by [Vouch: Sync Following](/.github/workflows/vouch-sync-following.yaml)." \
            --label ""
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
