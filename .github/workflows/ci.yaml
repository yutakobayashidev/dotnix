name: CI

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - .github/workflows/**
      - .github/actions/**

permissions: {}

jobs:
  gha-lint:
    permissions:
      contents: read
    uses: zunoser/reusable-workflows/.github/workflows/gha-lint.yml@9fca6ff223f82d81b1d003fa5cfac0794fad78a7 # v1.3.0
