name: 'Infra: Approved OpenTofu deploy'

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] A maintainer-controlled label gates execution at the event's immutable PR SHA.
    types:
      - labeled

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  deploy:
    name: ${{ github.event.label.name == 'safe-to-apply' && 'Apply' || 'Plan' }} (${{ matrix.name }})
    if: ${{ contains(fromJSON('["safe-to-plan", "safe-to-apply"]'), github.event.label.name) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # Required by niks3 for short-lived cache authentication.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gitea
            root: infra/gitea
          - name: uptime-kuma
            root: infra/uptime-kuma
          - name: tailscale
            root: infra/tailscale
    env:
      AWS_EC2_METADATA_DISABLED: 'true'
      TF_IN_AUTOMATION: 'true'
    steps:
      - name: Checkout trusted setup action
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: trusted
          persist-credentials: false
      - name: Setup Nix
        uses: ./trusted/.github/actions/setup-nix
      - name: Checkout approved pull request revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: source
          persist-credentials: false
      - name: Tailscale
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4.1.2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: status.home.yutakobayashi.com
      - name: OpenTofu ${{ github.event.label.name == 'safe-to-apply' && 'apply' || 'plan' }}
        working-directory: source
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          TF_VAR_tailscale_api_key: ${{ secrets.TAILSCALE_API_KEY }}
          TF_VAR_uptimekuma_endpoint: https://status.home.yutakobayashi.com
          TF_VAR_uptimekuma_username: ${{ secrets.UPTIME_KUMA_USERNAME }}
          TF_VAR_uptimekuma_password: ${{ secrets.UPTIME_KUMA_PASSWORD }}
          TF_VAR_discord_webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DEPLOY_MODE: ${{ github.event.label.name }}
          ROOT: ${{ matrix.root }}
        run: |
          set -euo pipefail

          nix develop .#infra-ci --command tofu -chdir="$ROOT" init \
            -reconfigure \
            -backend-config="endpoints={s3=\"$R2_ENDPOINT\"}"
          if [[ "$DEPLOY_MODE" == "safe-to-apply" ]]; then
            nix develop .#infra-ci --command tofu -chdir="$ROOT" plan -out=tfplan -input=false
            nix develop .#infra-ci --command tofu -chdir="$ROOT" apply -input=false -auto-approve tfplan
          else
            nix develop .#infra-ci --command tofu -chdir="$ROOT" plan -input=false -no-color
          fi
