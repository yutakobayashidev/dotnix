name: 'Infra: Approved OpenTofu deploy'

on:
  workflow_dispatch:
    inputs:
      target:
        description: Infrastructure to deploy
        type: choice
        required: true
        options:
          - uptime-kuma
          - gitea
          - tailscale
          - tailscale-ci
      mode:
        description: Review a plan before applying the same main revision
        type: choice
        required: true
        default: plan
        options:
          - plan
          - apply
      ci_key_recipient:
        description: Optional age public recipient for exporting unsigned CI keys (Tailscale apply only)
        type: string
        default: ''
  pull_request_target: # zizmor: ignore[dangerous-triggers] A maintainer-controlled label gates execution at the event's immutable PR SHA.
    types:
      - labeled

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || inputs.target }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  deploy:
    name: ${{ (github.event.label.name == 'safe-to-apply' || inputs.mode == 'apply') && 'Apply' || 'Plan' }} (${{ matrix.name }})
    if: ${{ (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || contains(fromJSON('["safe-to-plan", "safe-to-apply"]'), github.event.label.name) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # Required by niks3 for short-lived cache authentication.
    strategy:
      fail-fast: false
      matrix:
        name: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', inputs.target)) || fromJSON('["gitea", "uptime-kuma", "tailscale"]') }}
    env:
      AWS_EC2_METADATA_DISABLED: 'true'
      TF_IN_AUTOMATION: 'true'
    steps:
      - name: Checkout trusted setup action
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: trusted
          persist-credentials: false
      - name: Setup Nix
        uses: ./trusted/.github/actions/setup-nix
      - name: Checkout approved revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: source
          persist-credentials: false
          allow-unsafe-pr-checkout: true
      - name: Tailscale
        uses: tailscale/github-action@306e68a486fd2350f2bfc3b19fcd143891a4a2d8 # v4.1.2
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          ping: status.home.yutakobayashi.com
      - name: OpenTofu ${{ (github.event.label.name == 'safe-to-apply' || inputs.mode == 'apply') && 'apply' || 'plan' }}
        working-directory: source
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          TF_VAR_tailscale_api_key: ${{ secrets.TAILSCALE_API_KEY }}
          TF_VAR_uptimekuma_endpoint: https://status.home.yutakobayashi.com
          TF_VAR_uptimekuma_username: ${{ secrets.UPTIME_KUMA_USERNAME }}
          TF_VAR_uptimekuma_password: ${{ secrets.UPTIME_KUMA_PASSWORD }}
          TF_VAR_discord_webhook_url: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TF_VAR_state_encryption_passphrase: ${{ secrets.STATE_ENCRYPTION_PASSPHRASE }}
          DEPLOY_MODE: ${{ (github.event.label.name == 'safe-to-apply' || inputs.mode == 'apply') && 'apply' || 'plan' }}
          ROOT: infra/${{ matrix.name == 'tailscale-ci' && 'tailscale' || matrix.name }}
          CI_KEYS_ONLY: ${{ matrix.name == 'tailscale-ci' }}
          CI_KEY_RECIPIENT: ${{ inputs.ci_key_recipient }}
        run: |
          set -euo pipefail

          plan_args=()
          if [[ "$CI_KEYS_ONLY" == "true" ]]; then
            plan_args+=(
              -target=tailscale_tailnet_key.ci
              -target=tailscale_oauth_client.ci
              -target=tailscale_oauth_client.kasumilog_archive
            )
          fi

          nix develop .#infra-ci --command tofu -chdir="$ROOT" init \
            -reconfigure \
            -backend-config="endpoints={s3=\"$R2_ENDPOINT\"}"
          if [[ "$DEPLOY_MODE" == "apply" ]]; then
            nix develop .#infra-ci --command tofu -chdir="$ROOT" plan "${plan_args[@]}" -out=tfplan -input=false
            nix develop .#infra-ci --command tofu -chdir="$ROOT" apply -input=false -auto-approve tfplan
            if [[ "$ROOT" == "infra/tailscale" && -n "$CI_KEY_RECIPIENT" ]]; then
              nix develop .#infra-ci --command tofu -chdir="$ROOT" output -json ci_auth_keys \
                | nix develop .#infra-ci --command age -r "$CI_KEY_RECIPIENT" \
                    -o "$RUNNER_TEMP/tailscale-ci-keys.age"
            fi
          else
            nix develop .#infra-ci --command tofu -chdir="$ROOT" plan "${plan_args[@]}" -input=false -no-color
          fi
      - name: Upload encrypted CI enrollment keys
        if: ${{ github.event_name == 'workflow_dispatch' && contains(fromJSON('["tailscale", "tailscale-ci"]'), inputs.target) && inputs.mode == 'apply' && inputs.ci_key_recipient != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tailscale-ci-keys
          path: ${{ runner.temp }}/tailscale-ci-keys.age
          if-no-files-found: error
          retention-days: 1
