name: 'Vouch: Check PR'

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] Vouch reads VOUCHED.td from the target branch to check the PR author's vouch status. No checkout or code execution occurs.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    if: ${{ !contains(fromJSON('["OWNER", "COLLABORATOR", "MEMBER"]'), github.event.pull_request.author_association) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: mitchellh/vouch/action/check-pr@c6d80ead49839655b61b422700b7a3bc9d0804a9 # v1.4.2
        with:
          pr-number: ${{ github.event.pull_request.number }}
          auto-close: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
