name: 'CI: Nix build'

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - '.github/actions/setup-nix/**'
      - '.github/workflows/nix-build.yaml'
      - 'applications/**'
      - 'flake-module.nix'
      - 'flake.lock'
      - 'flake.nix'
      - 'homes/**'
      - 'modules/**'
              - 'modules/**'
              - 'overlays/**'
      - 'systems/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      nix: ${{ steps.filter.outputs.nix }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        id: filter
        with:
          filters: |
            nix:
              - '.github/actions/setup-nix/**'
              - '.github/workflows/nix-build.yaml'
              - 'applications/**'
              - 'flake-module.nix'
              - 'flake.lock'
              - 'flake.nix'
              - 'homes/**'
              - 'modules/**'
      - 'modules/**'
      - 'overlays/**'
              - 'systems/**'

  check:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.outputs.nix == 'true' || github.event_name == 'push') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup-nix
      - name: Evaluate flake outputs (host platform)
        run: |
          for output in checks packages devShells apps; do
            nix eval ".#$output.x86_64-linux" --apply 'x: builtins.attrNames x'
          done
          nix eval '.#formatter.x86_64-linux'
          nix eval '.#nixosConfigurations' --apply 'x: builtins.attrNames x'
          for host in B450M-Pro4 UM790-Pro X870-Stell-Legend-WiFi; do
            nix eval ".#nixosConfigurations.$host.config.networking.hostName" 2>&1 || true
          done
      - name: Check treefmt
        run: nix build .#checks.x86_64-linux.treefmt

  build:
    needs: [changes, check]
    if: ${{ !cancelled() && needs.check.result != 'failure' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: needs.check.result == 'success'
      - name: Free disk space (darwin)
        if: needs.check.result == 'success' && matrix.os == 'macos-latest'
        run: |
          sudo rm -rf \
            /Applications/Xcode_*.app \
            /Library/Developer/CoreSimulator \
            /Library/Android \
            ~/.dotnet \
            /usr/local/share/chromium \
            /usr/local/lib/node_modules \
            /usr/local/share/powershell || true
          df -h
      - uses: ./.github/actions/setup-nix
        if: needs.check.result == 'success'
      - name: Create /run for darwin
        if: needs.check.result == 'success' && matrix.os == 'macos-latest'
        run: |
          printf "run\tprivate/var/run\n" | sudo tee -a /etc/synthetic.conf
          /System/Library/Filesystems/apfs.fs/Contents/Resources/apfs.util -t || true
      - name: Build Nix configurations (linux)
        if: ${{ needs.check.result == 'success' && startsWith(matrix.os, 'ubuntu') }}
        run: |
          nix build \
            .#nixosConfigurations.B450M-Pro4.config.system.build.toplevel \
            .#nixosConfigurations.UM790-Pro.config.system.build.toplevel \
            .#nixosConfigurations.X870-Stell-Legend-WiFi.config.system.build.toplevel \
            .#nixosConfigurations.pi5.config.system.build.toplevel \
            .#devShells.x86_64-linux.default \
            .#devShells.aarch64-linux.default \
            --keep-going --no-link --show-trace \
            --print-out-paths
      - name: Build Nix configurations (darwin)
        if: ${{ needs.check.result == 'success' && matrix.os == 'macos-latest' }}
        run: |
          nix build \
            .#darwinConfigurations.M2-MacBook-Air.system \
            .#devShells.aarch64-darwin.default \
            --keep-going --no-link --show-trace \
            --print-out-paths
