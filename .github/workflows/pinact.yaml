name: 'CI: Actions dependency checks'

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pinact:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false
      - uses: suzuki-shunsuke/pinact-action@v3.0.0
        with:
          skip_push: 'true'
          fix: 'false'
          # This pilot is pinned by actions.lock and checked by actions-lock below.
          excludes: '^\.github/workflows/pinact\.yaml$'
      - name: Install actions-lock
        run: gh extension install github/gh-actions-lock --pin v0.4.0
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Verify pilot workflow lockfile
        run: gh actions-lock --verify .github/workflows/pinact.yaml
        env:
          GH_TOKEN: ${{ github.token }}
